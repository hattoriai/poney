name: release

# Publishes the Poney packages to npm when a GitHub release is published:
# the libraries (@hattoriai/poney-*) and the CLI (poney), in dependency
# order. By npm's trusted publishing: no token, npm trusts this workflow of
# this repository (each package's Settings → Trusted Publisher on
# npmjs.com, with the environment below), and each package says which run
# built it (provenance). See RELEASING.md.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its required reviewers approve each release before it is published.
    environment: npm
    permissions:
      contents: read
      # The run's OIDC identity, which npm checks in place of a token.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing takes npm 11.5.1 or later.
      - run: npm install --global npm@latest

      - run: npm ci

      # The release's tag and every published package name one version.
      - name: one version
        run: node scripts/version.mjs --check "${GITHUB_REF_NAME#v}"

      - run: npm run typecheck
      - run: npm test
      - run: npm run build:packages

      # A version on npm already (published by hand, or a rerun) is left as it is.
      - name: publish
        run: |
          for name in @hattoriai/poney-core @hattoriai/poney-layout @hattoriai/poney-react @hattoriai/poney-render @hattoriai/poney-ext-ownership @hattoriai/poney-ext-security poney; do
            version="$(npm pkg get version -w "$name" | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(Object.values(j)[0])')"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is on npm already"
            else
              npm publish -w "$name" --access public
            fi
          done
